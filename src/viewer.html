<title>__PROJECT__ atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D canvas; crate legend floats left, file inspector floats right, trail of hops runs along the bottom.
   On phones the legend becomes a drawer and the inspector a bottom sheet. */
:root {
  --bg: #e7ebef;
  --panel: rgba(248, 250, 251, 0.93);
  --panel-solid: #f8fafb;
  --line: #cdd5dd;
  --fg: #16202a;
  --muted: #5a6877;
  --faint: #8a97a5;
  --accent: #b0501b;        /* oxide copper: selection, outgoing edges, trail */
  --accent-2: #0d7780;      /* verdigris: incoming edges */
  --chip: #dfe5ea;
  --shadow: 0 10px 30px rgba(22, 32, 42, 0.12);
  --font-ui: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-display: "Bricolage Grotesque", "Schibsted Grotesk", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1015; --panel: rgba(17, 23, 30, 0.9); --panel-solid: #11171e; --line: #243040;
    --fg: #dde5ed; --muted: #8b9aab; --faint: #5f6d7d; --accent: #ec8a52; --accent-2: #4fc4ca;
    --chip: #1c2631; --shadow: 0 10px 30px rgba(0, 0, 0, 0.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1015; --panel: rgba(17, 23, 30, 0.9); --panel-solid: #11171e; --line: #243040;
  --fg: #dde5ed; --muted: #8b9aab; --faint: #5f6d7d; --accent: #ec8a52; --accent-2: #4fc4ca;
  --chip: #1c2631; --shadow: 0 10px 30px rgba(0, 0, 0, 0.45); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-ui);
  overflow: hidden; position: relative;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#scene { position: absolute; inset: 0; }
#overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#overlay svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.crate-label {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  font: 600 12px/1 var(--font-ui); letter-spacing: 0.02em; color: var(--fg);
  padding: 3px 7px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
  opacity: 0.85; transition: opacity 0.2s;
}
.crate-label.dep { font-weight: 500; color: var(--muted); }
.crate-label.dim { opacity: 0.25; }

.panel {
  position: absolute; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#left {
  top: 16px; left: max(16px, env(safe-area-inset-left, 0px)); width: 290px;
  max-height: calc(100% - 96px); display: flex; flex-direction: column; overflow: hidden;
}
#right {
  top: 16px; right: max(16px, env(safe-area-inset-right, 0px)); width: 370px;
  max-height: calc(100% - 96px); display: flex; flex-direction: column; overflow: hidden;
}
.pad { padding: 14px 16px; }
.head { display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 {
  margin: 0; font: 750 22px/1.1 var(--font-display); letter-spacing: -0.01em; text-wrap: balance;
  overflow-wrap: anywhere;
}
.brand .kind { font: 500 11px/1 var(--font-code); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.stats { display: flex; gap: 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.stats b { color: var(--fg); font-weight: 600; }

.search { position: relative; }
.search input {
  width: 100%; box-sizing: border-box; padding: 8px 10px 8px 30px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel-solid); font-family: var(--font-code); font-size: 12.5px;
}
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--muted); fill: none; }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 11px var(--font-code); color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
#results {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 5; max-height: 320px; overflow-y: auto;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px;
}
.res { display: grid; grid-template-columns: 10px 1fr; gap: 2px 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; align-items: center; }
.res:hover, .res.on { background: var(--chip); }
.res .p { font: 12px/1.3 var(--font-code); overflow-wrap: anywhere; min-width: 0; }
.res .c { grid-column: 2; font-size: 11px; color: var(--muted); }

.controls { display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.lbl { font: 600 10.5px/1 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 9px; font-size: 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--chip); color: var(--fg); font-weight: 600; }
.tog { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px 3px 7px; background: transparent; }
.tog .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; box-sizing: border-box; }
.tog[aria-pressed="true"] { color: var(--fg); }
.tog[aria-pressed="true"] .dot { background: currentColor; }
.tog.k-mod[aria-pressed="true"] .dot { color: var(--faint); }

#legend { overflow-y: auto; padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 1px; }
.group { padding: 10px 8px 4px; }
.crate {
  display: grid; grid-template-columns: 12px 1fr auto auto; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 6px; cursor: pointer; border: 0; background: transparent; text-align: left; width: 100%;
}
.crate:hover { background: var(--chip); }
.crate.on { background: var(--chip); box-shadow: inset 0 0 0 1px var(--line); }
.crate.off { opacity: 0.38; }
.sw { width: 10px; height: 10px; border-radius: 3px; }
.crate .nm { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.crate .nm small { color: var(--faint); font: 11px var(--font-code); margin-left: 4px; }
.crate .n { font: 11px var(--font-code); color: var(--muted); font-variant-numeric: tabular-nums; }
.eye { border: 0; background: transparent; padding: 2px; color: var(--faint); line-height: 0; border-radius: 4px; }
.eye:hover { color: var(--fg); }
.eye svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; }

/* inspector */
#insp-body { overflow-y: auto; }
.crumb { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--fg); font-weight: 500; }
.pill .sw { width: 8px; height: 8px; border-radius: 50%; }
.fpath { margin: 8px 0 2px; font: 500 15px/1.35 var(--font-code); overflow-wrap: anywhere; }
.fmod { font: 12px/1.4 var(--font-code); color: var(--muted); overflow-wrap: anywhere; }
.figures { display: flex; gap: 18px; margin-top: 12px; font-variant-numeric: tabular-nums; }
.figures div { display: flex; flex-direction: column; }
.figures b { font: 600 17px/1.1 var(--font-ui); }
.figures span { font-size: 11px; color: var(--muted); }
.figures .out b { color: var(--accent); }
.figures .in b { color: var(--accent-2); }
.actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel-solid); border-radius: 7px; padding: 5px 10px; font-size: 12.5px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel-solid); font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.abs { margin-top: 8px; font: 11px/1.4 var(--font-code); color: var(--faint); overflow-wrap: anywhere; user-select: all; }
.sec { border-top: 1px solid var(--line); }
.sec h3 { margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
.sec h3 .lbl { display: flex; align-items: center; gap: 6px; }
.sec h3 .lbl i { width: 14px; height: 2px; border-radius: 2px; display: inline-block; }
.sec h3 .cnt { font: 11px var(--font-code); color: var(--faint); }
.items { display: flex; flex-wrap: wrap; gap: 4px; }
.item { display: inline-flex; gap: 5px; align-items: baseline; border: 0; background: var(--chip); border-radius: 5px; padding: 2px 7px; font: 12px/1.5 var(--font-code); }
.item .k { font-size: 10px; color: var(--muted); }
.item.priv { opacity: 0.62; }
.item:hover { box-shadow: inset 0 0 0 1px var(--muted); }
.edges { display: flex; flex-direction: column; gap: 1px; }
.edge { display: grid; grid-template-columns: 8px 1fr auto; gap: 3px 9px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 0; background: transparent; text-align: left; width: 100%; }
.edge:hover { background: var(--chip); }
.edge .sw { width: 8px; height: 8px; border-radius: 50%; }
.edge .p { font: 12px/1.35 var(--font-code); overflow-wrap: anywhere; min-width: 0; }
.edge .w { font: 11px var(--font-code); color: var(--faint); font-variant-numeric: tabular-nums; }
.edge .names { grid-column: 2 / 4; font: 11px/1.4 var(--font-code); color: var(--muted); overflow-wrap: anywhere; }
.edge .names em { font-style: normal; color: var(--faint); }
.more { font-size: 12px; color: var(--muted); border: 0; background: transparent; padding: 6px 8px; text-decoration: underline; text-underline-offset: 3px; }
.empty { color: var(--muted); font-size: 13px; }
.empty p { margin: 0 0 8px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 12px; color: var(--muted); }
.keys kbd { font: 11px var(--font-code); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; justify-self: start; }

/* trail */
#trail {
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-height: 22px;
}
#trail .lbl { flex: none; display: flex; align-items: center; gap: 6px; }
#live { display: inline-flex; align-items: center; gap: 5px; font: 500 11px var(--font-ui); color: var(--accent-2); text-transform: none; letter-spacing: 0; }
#live i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
#steps { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: thin; align-items: center; }
.step { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel-solid); border-radius: 999px; padding: 2px 9px 2px 3px; font: 12px var(--font-code); }
.step b { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 999px; background: var(--accent); color: var(--panel-solid); font: 600 10.5px var(--font-ui); padding: 0 4px; box-sizing: border-box; }
.step.cur { border-color: var(--accent); }
.step .k { font-size: 10px; color: var(--muted); }
.step .sym { font-weight: 500; }
.step .f { font-size: 11px; color: var(--muted); }
.arrow { flex: none; color: var(--faint); font-size: 12px; }
.xc { flex: none; display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--font-ui); color: var(--muted); white-space: nowrap; }
.xc .sw { width: 8px; height: 8px; border-radius: 50%; }
.fork { flex: none; display: inline-flex; align-items: center; gap: 3px; border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 1px 7px 1px 5px; font: 11px var(--font-code); color: var(--muted); }
.fork:hover { color: var(--fg); border-color: var(--muted); }
.fork svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.5; }
#trailsvg .hop { font: 500 11px var(--font-code); fill: var(--accent); stroke: var(--bg); stroke-width: 3px; paint-order: stroke; text-anchor: middle; }
#trail .hint { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#toast { position: absolute; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 7px 12px; font-size: 12.5px; z-index: 20; max-width: calc(100% - 48px); white-space: pre-wrap; }

.float-tooltip-kap, .scene-tooltip {
  font: 12px/1.4 var(--font-ui) !important; color: var(--fg) !important; background: var(--panel-solid) !important;
  border: 1px solid var(--line); border-radius: 6px !important; padding: 6px 9px !important; box-shadow: var(--shadow);
}
.tt-p { font-family: var(--font-code); }
.tt-c { color: var(--muted); }

#menu { display: none; }
@media (max-width: 760px) {
  #left { width: auto; right: max(16px, env(safe-area-inset-right, 0px)); max-height: 60%; z-index: 6; }
  #left.closed #legend, #left.closed .controls { display: none; }
  #menu { display: inline-flex; }
  #right {
    top: auto; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
    width: auto; max-height: 42%;
  }
  #right.collapsed #insp-body .sec, #right.collapsed .actions, #right.collapsed .abs { display: none; }
}
@media (prefers-reduced-motion: reduce) { #live i { animation: none; } }
</style>

<div id="scene" aria-label="3D graph of source files"></div>
<div id="overlay"><svg id="trailsvg" aria-hidden="true"></svg><div id="labels"></div></div>

<aside id="left" class="panel closed">
  <div class="pad head">
    <div class="brand">
      <h1 id="pname"></h1>
      <button class="btn" id="menu" aria-expanded="false" aria-controls="legend">Crates</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="search">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Find a file or module" autocomplete="off" spellcheck="false" aria-label="Find a file or module">
      <kbd>/</kbd>
      <div id="results" hidden role="listbox"></div>
    </div>
  </div>
  <div class="pad controls">
    <div class="row" style="justify-content: space-between">
      <span class="lbl">Show</span>
      <div class="seg" role="group" aria-label="Neighborhood">
        <button id="hop-0" data-hops="0" aria-pressed="true" title="Every file">All</button>
        <button id="hop-1" data-hops="1" aria-pressed="false" title="Selected file and files one link away">1 hop</button>
        <button id="hop-2" data-hops="2" aria-pressed="false" title="Two links away">2</button>
        <button id="hop-3" data-hops="3" aria-pressed="false" title="Three links away">3</button>
      </div>
    </div>
    <div class="row">
      <button class="tog" id="k-use" data-k="use" aria-pressed="true" title="Edges from use declarations"><span class="dot"></span>use</button>
      <button class="tog" id="k-path" data-k="path" aria-pressed="true" title="Edges from qualified paths in code, like other::f()"><span class="dot"></span>paths</button>
      <button class="tog k-mod" id="k-mod" data-k="mod" aria-pressed="true" title="Edges from mod declarations"><span class="dot"></span>mod tree</button>
      <button class="tog" id="t-deps" aria-pressed="true" title="Show dependency crates"><span class="dot"></span>deps</button>
      <button class="tog" id="t-labels" aria-pressed="true" title="Crate name labels"><span class="dot"></span>labels</button>
      <button class="btn" id="fit" title="Fit everything in view (F)">Fit</button>
    </div>
  </div>
  <div id="legend"></div>
</aside>

<aside id="right" class="panel" aria-live="polite">
  <div id="insp-body"></div>
</aside>

<div id="trail" class="panel">
  <span class="lbl">Trail <span id="live" hidden><i></i>following editor</span></span>
  <div id="steps"></div>
  <button class="btn" id="copy-trail" hidden title="Copy every branch of the trail as indented text">Copy</button>
  <button class="btn" id="clear" hidden>Clear</button>
</div>
<div id="toast" class="panel" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.79.1/dist/3d-force-graph.min.js"></script>
<script>
(() => {
"use strict";
const DATA = /*__GRAPH__*/null;
const LIVE = /*__LIVE__*/false;
const NVIM = /*__NVIM__*/false;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => n.toLocaleString("en-US");
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store = {
  get(k, d) { try { const v = localStorage.getItem("atlas:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("atlas:" + k, JSON.stringify(v)); } catch {} },
};

const crates = DATA.crates;
const nodes = DATA.nodes;
const links = DATA.links.map((l) => ({ ...l, s: l.source, t: l.target }));
const out = nodes.map(() => []), inc = nodes.map(() => []);
for (const l of links) { out[l.s].push(l); inc[l.t].push(l); }

// ---------- state ----------
const S = {
  sel: null,            // selected node id
  crate: null,          // focused crate index
  hops: 0,
  kinds: { use: true, path: true, mod: true },
  deps: true,
  labels: store.get("labels", true),
  hidden: new Set(),
  steps: [],            // trail tree: { id, line, sym, parent, kids, pick }
  cur: -1,              // the step you are on
  hopSet: null,
  hl: new Set(),
};

// ---------- colors ----------
const isDark = () => {
  const t = document.documentElement.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
};
let crateColor = [];
const TOK = {};
function paint() {
  const dark = isDark();
  TOK.accent = css("--accent"); TOK.accent2 = css("--accent-2"); TOK.panel = css("--panel-solid");
  let wsI = 0, depI = 0;
  crateColor = crates.map((c) => {
    if (c.ws) {
      const h = (wsI++ * 137.508 + 24) % 360;
      return { h, s: dark ? 72 : 62, l: dark ? 64 : 44 };
    }
    const h = (depI++ * 137.508 + 200) % 360;
    return { h, s: dark ? 22 : 20, l: dark ? 56 : 52 };
  });
}
const hsla = (c, a) => `hsla(${c.h.toFixed(0)},${c.s}%,${c.l}%,${a})`;
const swatch = (i) => hsla(crateColor[i], 1);

// ---------- layout targets: workspace crates on an inner shell, deps on an outer one ----------
function fib(i, n, r) {
  if (n === 1) return { x: 0, y: 0, z: 0 };
  const y = 1 - (i / (n - 1)) * 2, rad = Math.sqrt(1 - y * y), th = i * 2.399963;
  return { x: Math.cos(th) * rad * r, y: y * r, z: Math.sin(th) * rad * r };
}
const wsIdx = crates.map((c, i) => i).filter((i) => crates[i].ws);
const depIdx = crates.map((c, i) => i).filter((i) => !crates[i].ws);
const scale = 34 * Math.cbrt(Math.max(nodes.length, 8));
const centers = [];
wsIdx.forEach((ci, k) => (centers[ci] = fib(k, wsIdx.length, wsIdx.length > 1 ? scale * 0.55 : 0)));
depIdx.forEach((ci, k) => (centers[ci] = fib(k, depIdx.length, scale * 1.5)));
for (const n of nodes) {
  const c = centers[n.pkg];
  n.x = c.x + (Math.random() - 0.5) * 30; n.y = c.y + (Math.random() - 0.5) * 30; n.z = c.z + (Math.random() - 0.5) * 30;
}
function clusterForce() {
  let ns = [];
  function f(alpha) {
    const k = alpha * 0.09;
    for (const n of ns) { const c = centers[n.pkg]; n.vx += (c.x - n.x) * k; n.vy += (c.y - n.y) * k; n.vz += (c.z - n.z) * k; }
  }
  f.initialize = (x) => (ns = x);
  return f;
}

// ---------- visibility ----------
const linkOn = (l) => l.k.some((k) => S.kinds[k]);
const nodeOn = (n) => !S.hidden.has(n.pkg) && (S.deps || crates[n.pkg].ws) && (!S.hopSet || S.hopSet.has(n.id));
const linkVis = (l) => linkOn(l) && nodeOn(nodes[l.s]) && nodeOn(nodes[l.t]);

function computeHop() {
  S.hopSet = null;
  if (S.sel == null || !S.hops) return;
  const seen = new Set([S.sel]);
  let frontier = [S.sel];
  for (let d = 0; d < S.hops; d++) {

  const walk = (k, depth) => {
    const st = S.steps[k], n = nodes[st.id], d = defOf(st);
    lines.push(`${"  ".repeat(depth)}${depth ? "→ " : ""}${d ? `${d.kind ? d.kind + " " : ""}${d.label}  ` : ""}${crates[n.pkg].name} › ${n.path}${st.line ? ":" + st.line : ""}`);
    for (const c of st.kids) walk(c, depth + 1);
  };
  S.steps.forEach((st, k) => { if (st.parent < 0) walk(k, 0); });
  return lines.join("\n");
}
$("#steps").addEventListener("click", (e) => {
  const f = e.target.closest("[data-fork]");
  if (f) return nextBranch(+f.dataset.fork);
  const t = e.target.closest("[data-step]");
  if (t) goStep(+t.dataset.step);
});
$("#copy-trail").addEventListener("click", () => copy(trailText(), "the trail"));
$("#clear").addEventListener("click", () => { S.steps = []; S.cur = -1; renderTrail(); });

// ---------- overlay: crate labels + trail path, projected every frame ----------
const labelsEl = $("#labels"), svg = $("#trailsvg");
const labelEls = crates.map((c, i) => {
  const d = document.createElement("div");
  d.className = "crate-label" + (c.ws ? "" : " dep");
  d.textContent = c.name;
  labelsEl.appendChild(d);
  return d;
});
function frame() {
  const W = el.clientWidth, H = el.clientHeight;
  const cam = G.camera();
  const dir = cam.getWorldDirection ? cam.getWorldDirection(cam.position.clone()) : null;
  const inFront = (p) => !dir || ((p.x - cam.position.x) * dir.x + (p.y - cam.position.y) * dir.y + (p.z - cam.position.z) * dir.z) > 0;
  // crate labels
  const sums = crates.map(() => ({ x: 0, y: 0, z: 0, n: 0, top: -Infinity }));
  if (S.labels) {
    for (const n of nodes) {
      if (n.x == null || !nodeOn(n)) continue;
      const s = sums[n.pkg]; s.x += n.x; s.y += n.y; s.z += n.z; s.n++;
    }
  }
  crates.forEach((c, i) => {
    const s = sums[i], d = labelEls[i];
    if (!S.labels || !s.n) { d.hidden = true; return; }
    const p = { x: s.x / s.n, y: s.y / s.n, z: s.z / s.n };
    if (!inFront(p)) { d.hidden = true; return; }
    const sc = G.graph2ScreenCoords(p.x, p.y, p.z);
    if (sc.x < -40 || sc.y < -20 || sc.x > W + 40 || sc.y > H + 20) { d.hidden = true; return; }
    d.hidden = false;
    d.style.left = sc.x + "px"; d.style.top = sc.y + "px";
    const focus = S.sel != null ? nodes[S.sel].pkg === i || [...S.hl].some((id) => nodes[id].pkg === i) : S.crate == null || S.crate === i;
    d.classList.toggle("dim", !focus);
  });
  // trail: every branch faintly; the bar's branch numbered, with the name each jump landed on
  let h = "";
  if (S.steps.length) {
    const acc = TOK.accent, p = branch(), on = new Set(p), proj = new Map();
    const at = (id) => {
      if (!proj.has(id)) { const n = nodes[id]; proj.set(id, n.x != null && nodeOn(n) && inFront(n) ? G.graph2ScreenCoords(n.x, n.y, n.z) : null); }
      return proj.get(id);
    };
    let names = "";
    S.steps.forEach((st, k) => {
      const from = st.parent >= 0 ? S.steps[st.parent].id : st.id;
      const a = at(from), b = at(st.id);
      if (from === st.id || !a || !b) return;
      const mine = on.has(k);
      h += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${acc}" stroke-width="${mine ? 1.6 : 1}" stroke-dasharray="5 4" stroke-opacity="${mine ? 0.85 : 0.3}"/>`;
      if (mine && st.sym) names += `<text class="hop" x="${(a.x + b.x) / 2}" y="${(a.y + b.y) / 2 - 6}">${esc(st.sym)}</text>`;
    });
    // A file reached more than once on the branch carries every number.
    const nums = new Map();
    p.forEach((k, i) => { const id = S.steps[k].id; nums.set(id, nums.has(id) ? nums.get(id) + "," + (i + 1) : String(i + 1)); });
    for (const [id, label] of nums) {
      const c = at(id);
      if (!c) continue;
      h += `<circle cx="${c.x}" cy="${c.y}" r="${8.5 + (label.length - 1) * 2.8}" fill="${acc}" fill-opacity="0.92"/><text x="${c.x}" y="${c.y + 3.5}" text-anchor="middle" font-size="10" font-weight="600" font-family="Schibsted Grotesk, system-ui, sans-serif" fill="${TOK.panel}">${label}</text>`;
    }
    h += names;
  }
  svg.innerHTML = h;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- search ----------
const q = $("#q"), res = $("#results");
let hits = [], cursor = 0;
function search(text) {
  const toks = text.toLowerCase().split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  const scored = [];
  for (const n of nodes) {
    const hay = (crates[n.pkg].name + " " + n.path + " " + n.mod).toLowerCase();
    if (!toks.every((t) => hay.includes(t))) continue;
    const file = n.path.toLowerCase().split("/").pop();
    let s = 0;
    for (const t of toks) { if (file.startsWith(t)) s += 4; else if (file.includes(t)) s += 2; }
    if (crates[n.pkg].ws) s += 1.5;
    scored.push([s - n.path.length / 200, n]);
  }
  return scored.sort((a, b) => b[0] - a[0]).slice(0, 14).map((x) => x[1]);
}
function showResults() {
  hits = search(q.value); cursor = 0;
  res.hidden = !q.value.trim();
  res.innerHTML = hits.length ? hits.map((n, k) => `<div class="res${k === cursor ? " on" : ""}" role="option" data-go="${n.id}"><span class="sw" style="background:${swatch(n.pkg)};width:8px;height:8px;border-radius:50%"></span><span class="p">${esc(n.path)}</span><span class="c">${esc(crates[n.pkg].name)} · ${esc(n.mod)}</span></div>`).join("")
    : `<div class="empty" style="padding:8px 10px">No file matches “${esc(q.value)}”.</div>`;
}
q.addEventListener("input", showResults);
q.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    cursor = (cursor + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % Math.max(hits.length, 1);
    [...res.children].forEach((c, k) => c.classList.toggle("on", k === cursor));
  } else if (e.key === "Enter" && hits[cursor]) {
    go(hits[cursor].id); q.value = ""; res.hidden = true; q.blur();
  } else if (e.key === "Escape") { q.value = ""; res.hidden = true; q.blur(); }
});
res.addEventListener("mousedown", (e) => {
  const t = e.target.closest("[data-go]");
  if (t) { e.preventDefault(); go(+t.dataset.go); q.value = ""; res.hidden = true; q.blur(); }
});
q.addEventListener("blur", () => setTimeout(() => (res.hidden = true), 120));

// ---------- controls ----------
function setHops(h) {
  S.hops = h;
  document.querySelectorAll("[data-hops]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.hops === h)));
}
document.querySelectorAll("[data-hops]").forEach((b) => b.addEventListener("click", () => {
  const h = +b.dataset.hops;
  if (h && S.sel == null) { toast("Select a file first, then narrow to its neighborhood."); return; }
  setHops(h); refresh();
  setTimeout(() => G.zoomToFit(700, 80, (n) => nodeOn(n)), 30);
}));
document.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => {
  const k = b.dataset.k; S.kinds[k] = !S.kinds[k]; b.setAttribute("aria-pressed", String(S.kinds[k])); refresh();
}));
$("#t-deps").addEventListener("click", (e) => {
  S.deps = !S.deps; e.currentTarget.setAttribute("aria-pressed", String(S.deps));
  if (!S.deps && S.sel != null && !crates[nodes[S.sel].pkg].ws) S.sel = null;
  refresh();
});
$("#t-labels").setAttribute("aria-pressed", String(S.labels));
$("#t-labels").addEventListener("click", (e) => { S.labels = !S.labels; store.set("labels", S.labels); e.currentTarget.setAttribute("aria-pressed", String(S.labels)); });
$("#fit").addEventListener("click", () => G.zoomToFit(700, 60, (n) => nodeOn(n)));
$("#menu").addEventListener("click", (e) => {
  const open = $("#left").classList.toggle("closed") === false;
  e.currentTarget.setAttribute("aria-expanded", String(open));
});
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input")) return;
  if (e.key === "/") { e.preventDefault(); q.focus(); }
  else if (e.key === "Escape") { S.sel = null; S.crate = null; setHops(0); refresh(); }
  else if (e.key === "f" || e.key === "F") G.zoomToFit(700, 60, (n) => nodeOn(n));
});
let toastT;
function toast(msg, selectable) {
  const t = $("#toast");
  t.textContent = msg; t.hidden = false;
  if (selectable) { t.style.userSelect = "all"; const r = document.createRange(); r.selectNodeContents(t); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), selectable ? 9000 : 3200);
}

// theme changes
const retheme = () => { paint(); G.backgroundColor(css("--bg")); refresh(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

// ---------- header ----------
$("#pname").textContent = DATA.name;
const wsFiles = nodes.filter((n) => crates[n.pkg].ws).length;
$("#stats").innerHTML = `<span><b>${fmt(nodes.length)}</b> files</span><span><b>${fmt(links.length)}</b> links</span><span><b>${wsIdx.length}</b>+<b>${depIdx.length}</b> crates</span><span><b>${fmt(wsFiles)}</b> in workspace</span>`;
if (window.innerWidth > 760) $("#left").classList.remove("closed");

// ---------- live mode: follow the editor ----------
if (LIVE) {
  $("#live").hidden = false;
  let since = 0, misses = 0;
  const poll = () => fetch("/events?since=" + since).then((r) => r.json()).then((evs) => {
    misses = 0;
    for (const ev of evs) {
      since = ev.seq;
      const j = ev.jump;
      if (ev.id == null) {
        const where = ev.file.split("/").slice(-3).join("/");
        toast(j ? `${j.sym} is defined outside this graph (${where}). Std and crates beyond --depth are not mapped.` : "Not in this graph: " + where);
        continue;
      }
      if (j) jumpStep(j.from, j.line, j.sym, ev.id, ev.line);
      else visitStep(ev.id, ev.line);
      select(ev.id, { fly: true, line: ev.line });
    }
  }).catch(() => { if (++misses === 3) { $("#live").hidden = true; toast("Lost the connection to the atlas server."); } })
    .finally(() => setTimeout(poll, misses >= 3 ? 4000 : 450));
  poll();
}

// ---------- open in a useful state: the main entry file of the biggest workspace crate ----------
renderLegend();
const main = wsIdx.slice().sort((a, b) => crates[b].files - crates[a].files)[0];
const entry = nodes.filter((n) => n.pkg === main && n.root).sort((a, b) => out[b.id].length - out[a.id].length)[0];
if (entry && !LIVE) { S.sel = entry.id; refresh(); } else refresh();
})();
</script>
